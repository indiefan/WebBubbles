name: Build & Deploy

on:
  push:
    branches: [main]

# One deploy at a time; a newer push waits for the running one to finish
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/webbubbles

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Bump patch version
        id: version
        run: |
          # Read current version, bump patch
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          # Update package.json (without npm lifecycle scripts)
          npm version "$NEW_VERSION" --no-git-tag-version
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Bumped version: $CURRENT → $NEW_VERSION"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer webhook
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          # -s without -S: curl's own errors can print the host, and this repo's logs are public
          curl -fs -o /dev/null -X POST "$WEBHOOK_URL" \
            --retry 5 --retry-delay 15 --retry-all-errors --max-time 30 \
            || { echo "::error::Portainer webhook failed (curl exit $?) — the stack was not updated"; exit 1; }

      # The webhook answering is not proof the stack updated, so wait until the
      # running app reports the commit we just built.
      - name: Verify the new version is live
        env:
          HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
          EXPECTED: ${{ steps.vars.outputs.short_sha }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::warning::DEPLOY_HEALTH_URL is not set — skipping deploy verification"
            exit 0
          fi

          for attempt in $(seq 1 36); do
            LIVE=$(curl -fs --max-time 10 "$HEALTH_URL" | jq -r '.version' 2>/dev/null || true)
            echo "Attempt $attempt: live=${LIVE:-unreachable} expected=$EXPECTED"
            if [ "$LIVE" = "$EXPECTED" ]; then
              echo "## Deployed ${{ steps.version.outputs.version }} (\`$EXPECTED\`)" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done

          echo "::error::Deploy did not go live: the app still reports '${LIVE:-unreachable}', expected '$EXPECTED'"
          exit 1
